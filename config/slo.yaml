service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Mục tiêu lab là 99.5% request có response_sent trong 3000ms trên cửa sổ 28 ngày. Error budget = 0.5% tổng request_received; 10,000 request cho phép tối đa 50 request lỗi hoặc chậm. Workload mẫu ít request nên không đủ để khẳng định SLO 28 ngày; cần đối chiếu baseline thực tế trong report.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
